services:
  node-api:
    build:
      context: ./node-api
    container_name: node-api
    environment:
      NODE_API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  go-api:
    build:
      context: ./go-api
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      GO_API_PORT: 8080
      NODE_API_URL: http://node-api:3000
      NODE_API_TIMEOUT_MS: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      API_KEY: ${API_KEY:-change-me-api-key}
    depends_on:
      node-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_API_KEY: ${API_KEY:-change-me-api-key}
    container_name: frontend
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
