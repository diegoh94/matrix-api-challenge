services:
  node-api:
    build:
      context: ./node-api
    container_name: node-api
    environment:
      NODE_API_PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  go-api:
    build:
      context: ./go-api
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      GO_API_PORT: 8080
      NODE_API_URL: http://node-api:3000
      NODE_API_TIMEOUT_MS: 5000
    depends_on:
      node-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
